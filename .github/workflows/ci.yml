name: CI
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
permissions:
  contents: read
jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          WHATSDEMO_REQUIRE_RELEASE: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
      - uses: actions/upload-artifact@v4
        with:
          name: whats-demo
          path: dist/
