name: PR policy
on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  route:
    name: PR branch policy
    runs-on: ubuntu-latest
    steps:
      # Use a normal PR check so GitHub can require it on the PR head.
      # Only run the protected base policy (development for production promotions), never PR-head code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref == 'main' && 'development' || github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pr-policy.cjs
